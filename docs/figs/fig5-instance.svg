<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" width="1060" height="400" role="img" aria-label="Instance diagnosis: clustering and packing"><style>
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--s1:#2a78d6;--s2:#eb6834;
        --grid:#e6e5e1;--band:#2a78d6}
  @media (prefers-color-scheme: dark){
   :root{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--s1:#3987e5;--s2:#d95926;
         --grid:#383835;--band:#3987e5}
  }
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .t{font-size:18px;font-weight:600;fill:var(--ink)}
  .st{font-size:12.5px;fill:var(--ink2)}
  .lab{font-size:12px;fill:var(--ink2)}
  .val{font-size:12px;font-weight:600;fill:var(--ink)}
  .small{font-size:11px;fill:var(--ink2)}
  .grid{stroke:var(--grid);stroke-width:1;fill:none}
  .axis{stroke:var(--ink2);stroke-width:1;fill:none;opacity:.45}
  .s1s{stroke:var(--s1);fill:none} .s1f{fill:var(--s1)}
  .s2s{stroke:var(--s2);fill:none} .s2f{fill:var(--s2)}
  .ref{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4;fill:none;opacity:.75}
</style><rect width="1060" height="400" fill="var(--surface)"/><text x="24.0" y="30.0" class="t" text-anchor="start" >Why fill rate is the lever, not elegant tours</text><text x="24.0" y="50.0" class="st" text-anchor="start" >Left: the children are tightly clustered, so local travel is cheap. Right: the solver therefore packs the sleigh almost perfectly.</text><rect x="68.0" y="305.6" width="9.9" height="0.4" rx="2" class="s1f"/><rect x="79.9" y="305.3" width="9.9" height="0.7" rx="2" class="s1f"/><rect x="91.9" y="302.7" width="9.9" height="3.3" rx="2" class="s1f"/><rect x="103.8" y="302.3" width="9.9" height="3.7" rx="2" class="s1f"/><rect x="115.8" y="298.6" width="9.9" height="7.4" rx="2" class="s1f"/><rect x="127.7" y="292.4" width="9.9" height="13.6" rx="2" class="s1f"/><rect x="139.6" y="282.0" width="9.9" height="24.0" rx="2" class="s1f"/><rect x="151.6" y="266.9" width="9.9" height="39.1" rx="2" class="s1f"/><rect x="163.5" y="239.4" width="9.9" height="66.6" rx="2" class="s1f"/><rect x="175.4" y="194.6" width="9.9" height="111.4" rx="2" class="s1f"/><rect x="187.4" y="166.1" width="9.9" height="139.9" rx="2" class="s1f"/><rect x="199.3" y="120.7" width="9.9" height="185.3" rx="2" class="s1f"/><rect x="211.2" y="96.0" width="9.9" height="210.0" rx="2" class="s1f"/><rect x="223.2" y="129.7" width="9.9" height="176.3" rx="2" class="s1f"/><rect x="235.1" y="193.2" width="9.9" height="112.8" rx="2" class="s1f"/><rect x="247.1" y="240.0" width="9.9" height="66.0" rx="2" class="s1f"/><rect x="259.0" y="252.5" width="9.9" height="53.5" rx="2" class="s1f"/><rect x="270.9" y="255.7" width="9.9" height="50.3" rx="2" class="s1f"/><rect x="282.9" y="247.6" width="9.9" height="58.4" rx="2" class="s1f"/><rect x="294.8" y="247.2" width="9.9" height="58.8" rx="2" class="s1f"/><rect x="306.8" y="244.4" width="9.9" height="61.6" rx="2" class="s1f"/><rect x="318.7" y="224.9" width="9.9" height="81.1" rx="2" class="s1f"/><rect x="330.6" y="214.2" width="9.9" height="91.8" rx="