<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 534" width="820" height="534" role="img" aria-label="Start temperature response, with the measured noise floor"><style>
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--s1:#2a78d6;--s2:#eb6834;
        --grid:#e6e5e1;--band:#2a78d6}
  @media (prefers-color-scheme: dark){
   :root{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--s1:#3987e5;--s2:#d95926;
         --grid:#383835;--band:#3987e5}
  }
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .t{font-size:18px;font-weight:600;fill:var(--ink)}
  .st{font-size:12.5px;fill:var(--ink2)}
  .lab{font-size:12px;fill:var(--ink2)}
  .val{font-size:12px;font-weight:600;fill:var(--ink)}
  .small{font-size:11px;fill:var(--ink2)}
  .grid{stroke:var(--grid);stroke-width:1;fill:none}
  .axis{stroke:var(--ink2);stroke-width:1;fill:none;opacity:.45}
  .s1s{stroke:var(--s1);fill:none} .s1f{fill:var(--s1)}
  .s2s{stroke:var(--s2);fill:none} .s2f{fill:var(--s2)}
  .ref{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4;fill:none;opacity:.75}
</style><rect width="820" height="534" fill="var(--surface)"/><text x="24.0" y="30.0" class="t" text-anchor="start" >The tuning curve, and how much of it is real</text><text x="24.0" y="50.0" class="st" text-anchor="start" >Blue: one 300 s run per temperature - this is the curve I tuned on. Orange: four repeats of the</text><text x="24.0" y="65.0" class="st" text-anchor="start" >single setting T0=500.</text><line class="grid" x1="82" y1="118.0" x2="570" y2="118.0"/><text x="72.0" y="122.0" class="small" text-anchor="end" >7,588</text><line class="grid" x1="82" y1="164.8" x2="570" y2="164.8"/><text x="72.0" y="168.8" class="small" text-anchor="end" >7,590</text><line class="grid" x1="82" y1="211.5" x2="570" y2="211.5"/><text x="72.0" y="215.5" class="small" text-anchor="end" >7,592</text><line class="grid" x1="82" y1="258.3" x2="570" y2="258.3"/><text x="72.0" y="262.3" class="small" text-anchor="end" >7,594</text><line class="grid" x1="82" y1="305.1" x2="570" y2="305.1"/><text x="72.0" y="309.1" class="small" text-anchor="end" >7,596</text><line class="grid" x1="82" y1="351.8" x2="570" y2="351.8"/><text x="72.0" y="355.8" class="small" text-anchor="end" >7,598</text><line class="grid" x1="82" y1="398.6" x2="570" y2="398.6"/><text x="72.0" y="402.6" class="small" text-anchor="end" >7,600</text><text x="82.0" y="442.0" class="small" text-anchor="middle" >100</text><text x="220.9" y="442.0" class="small" text-anchor="middle" >250</text><text x="326.0" y="442.0" class="small" text-anchor="middle" >500</text><text x="431.1" y="442.0" class="small" text-anchor="middle" >1000</text><text x="570.0" y="442.0" class="small" text-anchor="middle" >2500</text><text x="24.0" y="104.0" class="small" text-anchor="start" >million metres (lower is better)</text><text x="326.0" y="464.0" class="small" text-anchor="middle" >start temperature T0 (km, log scale)</text><polyline class="s1s" stroke-width="2" points="82.0,374.1 220.9,302.2 326.0,163.3 431.1,236.6 570.0,379.8"/><circle cx="82.0" cy="374.1" r="4.5" class="s1f" stroke="var(--surface)" stroke-width="2"/><circle cx="220.9" cy="302.2" r="4.5" class="s1f" stroke="var(--surface)" stroke-width="2"/><circle cx="326.0" cy="163.3" r="4.5" class="s1f" stroke="var(--surface)" stroke-width="2"/><circle cx="431.1" cy="236.6" r="4.5" class="s1f" stroke="var(--surface)" stroke-width="2"/><circle cx="570.0" cy="379.8" r="4.5" class="s1f" stroke="var(--surface)" stroke-width="2"/><line class="s2s" stroke-width="2" x1="352.0" y1="166.0" x2="352.0" y2="258.7"/><circle cx="352.0" cy="219.2" r="4" class="s2f" stroke="var(--surface)" stroke-width="1.5"/><circle cx="352.0" cy="258.7" r="4" class="s2f" stroke="var(--surface)" stroke-width="1.5"/><circle cx="352.0" cy="166.0" r="4" class="s2f" stroke="var(--surface)" stroke-width="1.5"/><circle cx="352.0" cy="233.3" r="4" class="s2f" stroke="var(--surface)" stroke-width="1.5"/><text x="364.0" y="262.7" class="val" text-anchor="start" >4 repeats of T0=500</text><text x="364.0" y="278.7" class="small" text-anchor="start" >spread 3.96, sd 1.67</text><line class="ref" x1="82" y1="163.3" x2="640.0" y2="163.3"/><text x="644.0" y="167.3" class="small" text-anchor="start" >the single run that</text><text x="644.0" y="181.3" class="small" text-anchor="start" >picked T0=500 -</text><text x="644.0" y="195.3" class="small" text-anchor="start" >luckier than all</text><text x="644.0" y="209.3" class="small" text-anchor="start" >four repeats</text><text x="24.0" y="492.0" class="small" text-anchor="start" >Only T0=100 and T0=2500 are clearly worse. Everything from 250 to 1000 sits inside the noise: the plateau is</text><text x="24.0" y="507.0" class="small" text-anchor="start" >real, its location is not.</text></svg>
