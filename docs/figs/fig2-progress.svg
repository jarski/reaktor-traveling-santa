<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 522" width="1120" height="522" role="img" aria-label="How the total distance fell over the session"><style>
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--s1:#2a78d6;--s2:#eb6834;
        --grid:#e6e5e1;--band:#2a78d6}
  @media (prefers-color-scheme: dark){
   :root{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--s1:#3987e5;--s2:#d95926;
         --grid:#383835;--band:#3987e5}
  }
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .t{font-size:18px;font-weight:600;fill:var(--ink)}
  .st{font-size:12.5px;fill:var(--ink2)}
  .lab{font-size:12px;fill:var(--ink2)}
  .val{font-size:12px;font-weight:600;fill:var(--ink)}
  .small{font-size:11px;fill:var(--ink2)}
  .grid{stroke:var(--grid);stroke-width:1;fill:none}
  .axis{stroke:var(--ink2);stroke-width:1;fill:none;opacity:.45}
  .s1s{stroke:var(--s1);fill:none} .s1f{fill:var(--s1)}
  .s2s{stroke:var(--s2);fill:none} .s2f{fill:var(--s2)}
  .ref{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4;fill:none;opacity:.75}
</style><rect width="1120" height="522" fill="var(--surface)"/><text x="24.0" y="30.0" class="t" text-anchor="start" >How the score fell, and what moved it</text><text x="24.0" y="50.0" class="st" text-anchor="start" >Total distance in million metres - lower is better. Each row is a measured run, in chronological order.</text><line class="ref" x1="346.1" y1="80" x2="346.1" y2="432"/><text x="346.1" y="74.0" class="small" text-anchor="middle" >radial lower bound (proven unreachable floor)</text><line class="ref" x1="743.4" y1="80" x2="743.4" y2="432"/><text x="743.4" y="74.0" class="small" text-anchor="middle" >best other entry - noahiscool13</text><text x="316.0" y="108.0" class="lab" text-anchor="end" >Clarke-Wright savings (starting point)</text><line class="grid" x1="330" y1="104" x2="1020" y2="104"/><text x="316.0" y="146.0" class="lab" text-anchor="end" >v1 SISR, T0=45, 30 s</text><line class="grid" x1="330" y1="142" x2="1020" y2="142"/><text x="316.0" y="184.0" class="lab" text-anchor="end" >v1 SISR, T0=45, 180 s</text><line class="grid" x1="330" y1="180" x2="1020" y2="180"/><text x="316.0" y="222.0" class="lab" text-anchor="end" >v1 SISR, T0=100, 180 s</text><line class="grid" x1="330" y1="218" x2="1020" y2="218"/><text x="316.0" y="260.0" class="lab" text-anchor="end" >v1 SISR, T0=250, 300 s</text><line class="grid" x1="330" y1="256" x2="1020" y2="256"/><text x="316.0" y="298.0" class="lab" text-anchor="end" >v2 decomposed, T0=250, 300 s</text><line class="grid" x1="330" y1="294" x2="1020" y2="294"/><text x="316.0" y="336.0" class="lab" text-anchor="end" >v2 decomposed, T0=500, 300 s</text><line class="grid" x1="330" y1="332" x2="1020" y2="332"/><text x="316.0" y="374.0" class="lab" text-anchor="end" >v2 decomposed, T0=500, 600 s</text><line class="grid" x1="330" y1="370" x2="1020" y2="370"/><text x="316.0" y="412.0" class="lab" text-anchor="end" >v2 + 3 h continuation (final)</text><line class="grid" x1="330" y1="408" x2="1020" y2="408"/><polyline class="s1s" stroke-width="1.6" stroke-opacity=".55" points="997.4,104.0 770.6,142.0 753.9,180.0 741.8,218.0 736.3,256.0 729.6,294.0 724.3,332.0 723.1,370.0 716.6,408.0"/><circle cx="997.4" cy="104.0" r="5" class="s1f" stroke="var(--surface)" stroke-width="2"/><text x="1009.4" y="108.0" class="val" text-anchor="start" >7,894.7</text><circle cx="770.6" cy="142.0" r="5" class="s1f" stroke="var(--surface)" stroke-width="2"/><text x="782.6" y="146.0" class="val" text-anchor="start" >7,641.6</text><circle cx="753.9" cy="180.0" r="5" class="s1f" stroke="var(--surface)" stroke-width="2"/><text x="765.9" y="184.0" class="val" text-anchor="start" >7,622.9</text><circle cx="741.8" cy="218.0" r="5" class="s1f" stroke="var(--surface)" stroke-width="2"/><text x="753.8" y="222.0" class="val" text-anchor="start" >7,609.4</text><circle cx="736.3" cy="256.0" r="5" class="s1f" stroke="var(--surface)" stroke-width="2"/><text x="748.3" y="260.0" class="val" text-anchor="start" >7,603.4</text><circle cx="729.6" cy="294.0" r="5" class="s1f" stroke="var(--surface)" stroke-width="2"/><text x="741.6" y="298.0" class="val" text-anchor="start" >7,595.9</text><circle cx="724.3" cy="332.0" r="5" class="s1f" stroke="var(--surface)" stroke-width="2"/><text x="736.3" y="336.0" class="val" text-anchor="start" >7,589.9</text><circle cx="723.1" cy="370.0" r="5" class="s1f" stroke="var(--surface)" stroke-width="2"/><text x="735.1" y="374.0" class="val" text-anchor="start" >7,588.6</text><circle cx="716.6" cy="408.0" r="6.5" class="s2f" stroke="var(--surface)" stroke-width="2"/><text x="728.6" y="412.0" class="val" text-anchor="start" >7,581.4</text><line class="axis" x1="330" y1="442" x2="1020" y2="442"/><line class="axis" x1="375.0" y1="442" x2="375.0" y2="447"/><text x="375.0" y="461.0" class="small" text-anchor="middle" >7,200</text><line class="axis" x1="554.1" y1="442" x2="554.1" y2="447"/><text x="554.1" y="461.0" class="small" text-anchor="middle" >7,400</text><line class="axis" x1="733.3" y1="442" x2="733.3" y2="447"/><text x="733.3" y="461.0" class="small" text-anchor="middle" >7,600</text><line class="axis" x1="912.5" y1="442" x2="912.5" y2="447"/><text x="912.5" y="461.0" class="small" text-anchor="middle" >7,800</text><text x="24.0" y="488.0" class="small" text-anchor="start" >The two big steps are architectural: SISR replacing the savings construction, and spatial decomposition replacing independent chains. Adjacent rows differing</text><text x="24.0" y="503.0" class="small" text-anchor="start" >by less than about 4 are inside the measured noise floor.</text></svg>
