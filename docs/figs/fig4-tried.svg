<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 402" width="1000" height="402" role="img" aria-label="Ideas tested against the baseline, with the noise floor"><style>
  :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--s1:#2a78d6;--s2:#eb6834;
        --grid:#e6e5e1;--band:#2a78d6}
  @media (prefers-color-scheme: dark){
   :root{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--s1:#3987e5;--s2:#d95926;
         --grid:#383835;--band:#3987e5}
  }
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .t{font-size:18px;font-weight:600;fill:var(--ink)}
  .st{font-size:12.5px;fill:var(--ink2)}
  .lab{font-size:12px;fill:var(--ink2)}
  .val{font-size:12px;font-weight:600;fill:var(--ink)}
  .small{font-size:11px;fill:var(--ink2)}
  .grid{stroke:var(--grid);stroke-width:1;fill:none}
  .axis{stroke:var(--ink2);stroke-width:1;fill:none;opacity:.45}
  .s1s{stroke:var(--s1);fill:none} .s1f{fill:var(--s1)}
  .s2s{stroke:var(--s2);fill:none} .s2f{fill:var(--s2)}
  .ref{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4;fill:none;opacity:.75}
</style><rect width="1000" height="402" fill="var(--surface)"/><text x="24.0" y="30.0" class="t" text-anchor="start" >Five plausible improvements, measured</text><text x="24.0" y="50.0" class="st" text-anchor="start" >Change in total distance vs. the baseline arm, million metres. Bars to the right are worse; to the left, better.</text><rect x="362.8" y="94" width="409.4" height="226" fill="var(--band)" opacity="0.10"/><text x="567.5" y="86.0" class="small" text-anchor="middle" >+/- measured noise floor (4.0) - differences inside this band are not resolved</text><line class="axis" x1="567.5" y1="94" x2="567.5" y2="320"/><text x="314.0" y="123.0" class="lab" text-anchor="end" >Cyclic reheating instead of one cooldown</text><text x="314.0" y="138.0" class="small" text-anchor="end" >600 s pair</text><rect x="567.5" y="114" width="269.3" height="18" rx="4" class="s1f" opacity="1"/><text x="844.8" y="128.0" class="val" text-anchor="start" >+5.21</text><text x="314.0" y="167.0" class="lab" text-anchor="end" >Round length 20 s (vs 10 s)</text><text x="314.0" y="182.0" class="small" text-anchor="end" >300 s pair, T0=1000</text><rect x="567.5" y="158" width="131.6" height="18" rx="4" class="s1f" opacity="0.35"/><text x="707.2" y="172.0" class="val" text-anchor="start" >+2.55</text><text x="960.0" y="172.0" class="small" text-anchor="end" >within noise</text><text x="314.0" y="211.0" class="lab" text-anchor="end" >Merge each cell's final state, not best</text><text x="314.0" y="226.0" class="small" text-anchor="end" >300 s pair, T0=250</text><rect x="567.5" y="202" width="51.0" height="18" rx="4" class="s1f" opacity="0.35"/><text x="626.5" y="216.0" class="val" text-anchor="start" >+0.99</text><text x="960.0" y="216.0" class="small" text-anchor="end" >within noise</text><text x="314.0" y="255.0" class="lab" text-anchor="end" >Larger removals, cbar 20 (vs 10)</text><text x="314.0" y="270.0" class="small" text-anchor="end" >300 s pair, T0=250</text><rect x="567.5" y="246" width="10.4" height="18" rx="4" class="s1f" opacity="0.35"/><text x="585.9" y="260.0" class="val" text-anchor="start" >+0.20</text><text x="960.0" y="260.0" class="small" text-anchor="end" >within noise</text><text x="314.0" y="299.0" class="lab" text-anchor="end" >Round length 5 s (vs 10 s)</text><text x="314.0" y="314.0" class="small" text-anchor="end" >300 s pair, T0=250</text><rect x="505.1" y="290" width="62.5" height="18" rx="4" class="s2f" opacity="0.35"/><text x="497.1" y="304.0" class="val" text-anchor="end" >-1.21</text><text x="960.0" y="304.0" class="small" text-anchor="end" >within noise</text><line class="axis" x1="330" y1="326" x2="960" y2="326"/><line class="axis" x1="361.0" y1="326" x2="361.0" y2="331"/><text x="361.0" y="345.0" class="small" text-anchor="middle" >-4</text><line class="axis" x1="464.3" y1="326" x2="464.3" y2="331"/><text x="464.3" y="345.0" class="small" text-anchor="middle" >-2</text><line class="axis" x1="567.5" y1="326" x2="567.5" y2="331"/><text x="567.5" y="345.0" class="small" text-anchor="middle" >0</text><line class="axis" x1="670.8" y1="326" x2="670.8" y2="331"/><text x="670.8" y="345.0" class="small" text-anchor="middle" >+2</text><line class="axis" x1="774.1" y1="326" x2="774.1" y2="331"/><text x="774.1" y="345.0" class="small" text-anchor="middle" >+4</text><line class="axis" x1="877.4" y1="326" x2="877.4" y2="331"/><text x="877.4" y="345.0" class="small" text-anchor="middle" >+6</text><text x="24.0" y="388.0" class="small" text-anchor="start" >Only the top bar clears the noise floor. Three of these were written up as settled conclusions before the floor was measured - they were not.</text></svg>
