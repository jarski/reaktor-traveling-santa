[package]
name = "traveling_santa"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ndarray = { version = "0.15.6", features = ["rayon", "serde-1"] }
rand = "0.8.5"
csv = "1.1"
rayon = "1.5"
log = "0.4"
env_logger = "0.9"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
num_cpus = "1.13"
itertools = "0.10.5"
lazy_static = "1.4.0"
